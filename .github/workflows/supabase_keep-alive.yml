name: Supabase Keep-Alive

on:
  schedule:
    # Runs at 00:00 UTC every 3 days
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping-database:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Gateway
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          CLEAN_URL="${SUPABASE_URL%/}"

          echo "Pinging Supabase at ${CLEAN_URL}..."

          # Sends a keep-alive ping through the Supabase API Gateway
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "${CLEAN_URL}/auth/v1/health" \
            -H "apikey: ${SUPABASE_ANON_KEY}")

          echo "Supabase HTTP response code: $RESPONSE"

          if [ "$RESPONSE" -eq 200 ]; then
            echo "Database gateway active: ping successful."
            exit 0
          else
            echo "Error: Received HTTP status $RESPONSE"
            exit 1
          fi
